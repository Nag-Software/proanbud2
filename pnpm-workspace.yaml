allowBuilds:
  core-js: false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Sikkerhetsrettelser i transitive pakker som foreldrepakken låser til en
# sårbar versjon (Dependabot). Fjern en linje når foreldrepakken selv krever
# den rettede versjonen.
overrides:
  "ip-address@<10.7.1": ^10.7.1
  "moment@<2.31.0": ^2.31.0
  "nodemailer@<10.0.9": ^10.0.9
  "uuid@<11.1.1": ^11.1.1
